<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와이퍼넷 뷰어</title>
<!-- 시뮬레이션 뷰어(V6, Task 8). 영상 녹화용. 서버 /v1/* 를 1초마다 읽는다.
     배경은 OSM 표준 타일. 타일 사용 정책(https://operations.osmfoundation.org/policies/tiles/)을 지킨다:
     정확한 타일 주소, 지도 오른쪽 아래 출처 표시, 브라우저 기본 Referer·캐시, 미리 받기 없음, 데모 지역 밖으로 못 나감.
     데모·개발 전용이다. 실제 배포 앱에는 쓰지 않는다. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --ink: #1d232b; --muted: #5b6470; --panel: rgba(255, 255, 255, 0.94); --line: #d9dee4;
    --rain1: #cfe8fb; --rain2: #6fb1f0; --rain3: #2b4fb5; --rain4: #7b3fb8;
    --none: #8a8f98; --caution: #f2c230; --warning: #f08a24; --danger: #e0312d;
  }
  html, body { height: 100%; margin: 0; background: #eef1f4; color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .osm-tiles { filter: grayscale(1) brightness(1.06) contrast(0.82); }
  #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; display: none;
    padding: 10px 20px; background: #3b2a12; color: #fff3df; font-size: 20px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #banner .tag { background: var(--warning); color: #1d1200; border-radius: 6px; padding: 2px 8px; margin-right: 10px; }
  #panel { position: absolute; top: 16px; left: 16px; z-index: 1000; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 260px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); }
  #side { position: absolute; top: 16px; right: 16px; z-index: 1000; width: 300px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); }
  body.has-banner #panel, body.has-banner #side { top: 60px; }
  #title, .side-title { font-size: 16px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .up-row { display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .up-row .name { font-size: 17px; font-weight: 700; }
  .up-row .lv { font-size: 17px; font-weight: 800; }
  .up-row .sub { grid-column: 2 / -1; font-size: 14px; color: var(--muted); }
  #clock { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #date { font-size: 15px; color: var(--muted); }
  #meta { margin-top: 6px; font-size: 17px; }
  .legend { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; font-size: 15px; align-items: center; }
  .legend h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 14px; color: var(--muted); font-weight: 600; }
  .sw { width: 18px; height: 14px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.15); }
  .sw.blank { background: transparent; border: 1px dashed #8a8f98; }
  .car { width: 10px; height: 10px; margin-left: 4px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); }
  .up-label { background: rgba(255, 255, 255, 0.92); border: 0; border-radius: 6px; box-shadow: none;
    font-size: 15px; font-weight: 700; padding: 2px 6px; color: var(--ink); }
  .up-label::before { display: none; }
  .leaflet-popup-content { font-size: 16px; line-height: 1.5; }
  .leaflet-popup-content b.level { font-size: 18px; }
  .leaflet-control-attribution { font-size: 14px; padding: 2px 8px; background: rgba(255, 255, 255, 0.9) !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="banner"></div>
<div id="panel">
  <div id="title">와이퍼넷 · 강남 집중호우 재현</div>
  <div id="clock">--:--:--</div>
  <div id="date">시뮬레이터를 기다리는 중</div>
  <div id="meta"></div>
  <div class="legend">
    <h4>비 세기 (주변 차량 와이퍼)</h4>
    <span class="sw" style="background: var(--rain1)"></span><span>10 mm/h 미만</span>
    <span class="sw" style="background: var(--rain2)"></span><span>10~30</span>
    <span class="sw" style="background: var(--rain3)"></span><span>30~50</span>
    <span class="sw" style="background: var(--rain4)"></span><span>50 이상</span>
    <span class="sw blank"></span><span>색 없음: 차 3대 미만이라 판단 보류</span>
    <h4>차량 (와이퍼)</h4>
    <span class="car" style="background: #9aa0a6"></span><span>꺼짐</span>
    <span class="car" style="background: #7cc4f5"></span><span>간헐</span>
    <span class="car" style="background: #2f7fe0"></span><span>연속 1~3단</span>
    <span class="car" style="background: #1b2f8f"></span><span>연속 4~5단</span>
    <h4>지하차도</h4>
    <span class="dot" style="background: var(--none)"></span><span>위험 없음</span>
    <span class="dot" style="background: var(--caution)"></span><span>주의</span>
    <span class="dot" style="background: var(--warning)"></span><span>경고</span>
    <span class="dot" style="background: var(--danger)"></span><span>위험</span>
  </div>
</div>
<div id="side">
  <div class="side-title">지하차도</div>
  <div id="uplist"></div>
</div>
<script>
const DEMO = [[37.47, 127.00], [37.53, 127.07]];
// 데모 지하차도 6곳이 모두 이 특보구역(서울동남권)이다(C2 warning_area). 위쪽 띠에는 이 구역만 보인다
const DEMO_WARNING_AREA = "L1100100";
const REASON_SHORT = { vehicles: "주변 차량", radar: "레이더", kma_warning: "호우특보", alert_closure: "통제 문자", alert_rain: "호우 문자" };
const DENSITY = { current: "현재 밀도 (지역 안 100대)", future: "미래 밀도 (지역 안 1,500대)" };
const LEVEL_KO = { NONE: "위험 없음", CAUTION: "주의", WARNING: "경고", DANGER: "위험" };
const LEVEL_COLOR = { NONE: "--none", CAUTION: "--caution", WARNING: "--warning", DANGER: "--danger" };
const REASON_KO = {
  vehicles: "주변 차량 와이퍼", saturated: "와이퍼 최고 단계 지속 (레이더로 보정)", radar: "기상청 레이더",
  kma_warning: "호우특보", alert_closure: "재난문자: 지하차도 통제", alert_rain: "재난문자: 호우 안내",
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const map = L.map("map", {
  zoomControl: false, minZoom: 13, maxZoom: 16,
  maxBounds: L.latLngBounds(DEMO).pad(0.3), maxBoundsViscosity: 1.0,
}).fitBounds(DEMO, { paddingTopLeft: [300, 50], paddingBottomRight: [330, 10] });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, className: "osm-tiles",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const canvas = L.canvas({ padding: 0.2 });
const rainLayer = L.layerGroup().addTo(map);
const carLayer = L.layerGroup().addTo(map);
const upMarkers = {};

function rainColor(mmph) {
  return css(mmph < 10 ? "--rain1" : mmph < 30 ? "--rain2" : mmph < 50 ? "--rain3" : "--rain4");
}

// 와이퍼 단계 색: 꺼짐 회색, 간헐 연파랑, 연속 1~3 파랑, 연속 4~5 남색. AUTO는 최근 60초 횟수로 같은 단계(40회 = 연속)
function carColor(v) {
  if (v.state !== "ON") return "#9aa0a6";
  if (v.switch === "AUTO") return (v.auto_wpm || 0) < 27 ? "#7cc4f5" : "#2f7fe0";
  if (v.switch.startsWith("INTERMITTENT")) return "#7cc4f5";
  if (v.switch.startsWith("CONTINUOUS")) return Number(v.switch.slice(-1)) <= 3 ? "#2f7fe0" : "#1b2f8f";
  return "#9aa0a6";
}

// 데모 지역 칸 중 비 세기를 낸 칸(최근 10분 차 3대 이상)의 비율. 현재/미래 밀도를 비교하는 숫자다
function demoCoverage(body) {
  const { lat: dLat, lng: dLng } = body.cell;
  const [r0, c0, r1, c1] = [Math.floor(DEMO[0][0] / dLat), Math.floor(DEMO[0][1] / dLng), Math.floor(DEMO[1][0] / dLat), Math.floor(DEMO[1][1] / dLng)];
  const have = body.cells.filter(c => c.row >= r0 && c.row <= r1 && c.col >= c0 && c.col <= c1).length;
  return [have, (r1 - r0 + 1) * (c1 - c0 + 1)];
}

function drawRain(body) {
  rainLayer.clearLayers();
  const { lat: dLat, lng: dLng } = body.cell;
  for (const c of body.cells) {
    L.rectangle([[c.row * dLat, c.col * dLng], [(c.row + 1) * dLat, (c.col + 1) * dLng]], {
      renderer: canvas, stroke: false, fillColor: rainColor(c.mmph), fillOpacity: 0.5, interactive: false,
    }).addTo(rainLayer);
  }
}

function drawCars(body) {
  carLayer.clearLayers();
  for (const v of body.vehicles) {
    L.circleMarker([v.lat, v.lng], {
      renderer: canvas, radius: 4, weight: 1, color: "#ffffff", fillColor: carColor(v), fillOpacity: 0.95, interactive: false,
    }).addTo(carLayer);
  }
}

function popupHtml(u) {
  const reasons = u.reasons.length ? u.reasons.map(r => esc(REASON_KO[r] || r)).join("<br>") : "없음";
  const alerts = u.alerts.map(a => `<br><small>${esc(a.sent_at.slice(11, 16))} ${esc(a.text)}</small>`).join("");
  return `<b>${esc(u.name)}</b><br><b class="level" style="color:${css(LEVEL_COLOR[u.level])}">${LEVEL_KO[u.level]}</b>`
    + `<br>최근 10분 ${u.mmph_10m.toFixed(0)} mm/h · 1시간 ${u.acc1h_mm.toFixed(0)} mm<br><br><b>근거</b><br>${reasons}${alerts}`;
}

// 처음 WARNING 이상이 된 시각. 뷰어가 본 것만 기억하므로 시뮬레이션 시작 전에 열어 둔다. 시계가 뒤로 가면(새 실행) 지운다
const firstWarn = {};
let lastAt = null;

function drawUnderpasses(body) {
  if (!body.at || (lastAt && body.at < lastAt)) for (const k in firstWarn) delete firstWarn[k];   // 서버 초기화 또는 새 실행
  if (body.at) lastAt = body.at;
  const rows = [];
  for (const u of body.underpasses) {
    if (body.at && (u.level === "WARNING" || u.level === "DANGER") && !firstWarn[u.id]) firstWarn[u.id] = body.at.slice(11, 16);
    const why = u.reasons.map(r => REASON_SHORT[r]).filter(Boolean).join(" · ");
    const since = firstWarn[u.id] ? `경고 ${firstWarn[u.id]}부터` : "";
    rows.push(`<div class="up-row"><span class="dot" style="background:${css(LEVEL_COLOR[u.level])}"></span>`
      + `<span class="name">${esc(u.name)}</span><span class="lv" style="color:${css(LEVEL_COLOR[u.level])}">${LEVEL_KO[u.level]}</span>`
      + `<span class="sub">${[since, why].filter(Boolean).map(esc).join(" · ") || "근거 없음"}</span></div>`);
    const color = css(LEVEL_COLOR[u.level]);
    let m = upMarkers[u.id];
    if (!m) {
      m = upMarkers[u.id] = L.circleMarker([u.lat, u.lng], { radius: 11, weight: 3, color: "#ffffff", fillOpacity: 1 })
        .bindTooltip(u.name, { permanent: true, direction: "right", offset: [12, 0], className: "up-label" })
        .bindPopup("")
        .addTo(map);
    }
    m.setStyle({ fillColor: color });
    m.setPopupContent(popupHtml(u));
    m.bringToFront();
  }
  document.getElementById("uplist").innerHTML = rows.join("");
}

function drawBanner(body) {
  const banner = document.getElementById("banner");
  const parts = body.warnings.filter(w => w.area_code === DEMO_WARNING_AREA).map(w =>
    `<span class="tag">${w.stress === "WARNING" ? "호우경보" : "호우주의보"}</span>${esc(w.area_name)} ${esc(w.start.slice(11, 16))}부터`);
  const last = body.alerts[body.alerts.length - 1];
  if (last) parts.push(`<span class="tag">재난문자 ${esc(last.sent_at.slice(11, 16))}</span>${esc(last.text)}`);
  banner.innerHTML = parts.join("&nbsp;&nbsp;&nbsp;");
  banner.style.display = parts.length ? "block" : "none";
  document.body.classList.toggle("has-banner", parts.length > 0);
}

const density = DENSITY[new URLSearchParams(location.search).get("density")] || "";

async function tick() {
  try {
    const get = path => fetch(path, { cache: "no-store" }).then(r => r.json());
    const [clock, rain, risk, ext, cars] = await Promise.all([
      get("/v1/clock"), get("/v1/rain-map"), get("/v1/underpass-risk"), get("/v1/external"), get("/v1/debug/vehicles"),
    ]);
    if (clock.now) {
      document.getElementById("clock").textContent = clock.now.slice(11, 19);
      document.getElementById("date").textContent = clock.now.slice(0, 10) + " (시뮬레이션 시각)";
    }
    drawRain(rain);
    drawCars(cars);
    const [have, total] = demoCoverage(rain);
    document.getElementById("meta").innerHTML = [density, `비 세기를 판단한 칸 ${have} / ${total} (${Math.round(have / total * 100)}%)`]
      .filter(Boolean).map(esc).join("<br>");
    drawUnderpasses(risk);
    drawBanner(ext);
  } catch (err) {
    document.getElementById("date").textContent = "서버에 연결할 수 없음";
  } finally {
    setTimeout(tick, 1000);
  }
}
tick();
</script>
</body>
</html>
